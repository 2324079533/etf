name: Daily ETF Analysis

on:
  schedule:
    # 国际标准时间 UTC 09:30，即北京时间每个工作日（周一至周五）17:30
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 启用手动触发按钮

jobs:
  run-etf-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4        使用: actions/checkout@v4

      - name: 配置 Python 环境      - 名称: 配置 Python 环境
        uses: actions/setup-python@v5        使用: actions/setup-python@v5
        with:
          python-version: '3.10'          Python 版本: '3.10'
          cache: 'pip'          缓存: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行每日分析与推送
        env:
          ETF_LIST: ${{ secrets.ETF_LIST }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}          飞书Webhook: ${{ secrets.FEISHU_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}          钉钉Webhook: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python main.py
